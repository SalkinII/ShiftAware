name: Build & Publish Docker Image

# ─── Triggers ────────────────────────────────────────────────
# 1. Push to deploy branch  → automatic build
# 2. Manual trigger         → "Run workflow" button in GitHub UI
on:
  push:
    branches: [deploy]
  workflow_dispatch:
    inputs:
      tag_override:
        description: "Optional image tag (default: latest + SHA)"
        required: false
        type: string

# ─── Permissions ─────────────────────────────────────────────
permissions:
  contents: read
  packages: write

# ─── Environment ─────────────────────────────────────────────
env:
  REGISTRY: ghcr.io
  # Automatically resolves to your-username/your-repo
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ──────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Docker metadata (tags + labels) ───────────────────
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Always tag as "latest"
            type=raw,value=latest
            # Tag with short SHA for traceability
            type=sha,prefix=,format=short
            # Use manual override if provided
            type=raw,value=${{ inputs.tag_override }},enable=${{ inputs.tag_override != '' }}

      # ── Authenticate to GHCR ──────────────────────────────
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Build cache setup ─────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Build & Push ──────────────────────────────────────
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Summary ───────────────────────────────────────────
      - name: Print image URL
        run: |
          echo "## 🐳 Image published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**SHA tag:** \`$(echo ${{ github.sha }} | cut -c1-7)\`" >> $GITHUB_STEP_SUMMARY
